name: Build PyFone APK & Update README

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Calculate Version Number (1.n)
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          echo "tag=1.$COMMIT_COUNT" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyFone-v${{ steps.version.outputs.tag }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Update README with Download Badge
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BADGE_LINE="[![PyFone Download](https://img.shields.io/badge/PyFone-v${VERSION}-395886?style=for-the-badge&logo=android&logoColor=white)](${DOWNLOAD_URL})"

          if ! grep -q "PYFONE_DOWNLOAD_BADGE" README.md; then
            printf '\n## 📥 Download APK\n<!-- PYFONE_DOWNLOAD_BADGE -->\n' >> README.md
          fi

          # drop any old badge line, then re-insert under the marker
          sed -i '/img.shields.io\/badge\/PyFone-v/d' README.md
          sed -i "s|<!-- PYFONE_DOWNLOAD_BADGE -->|<!-- PYFONE_DOWNLOAD_BADGE -->\n${BADGE_LINE}|" README.md

      - name: Commit and Push README Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update PyFone download badge to ${{ steps.version.outputs.tag }}" || exit 0
          git push
