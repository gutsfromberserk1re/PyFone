name: Build PyFone APK & Update README

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Calculate Version Number (1.n)
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION="1.$COMMIT_COUNT"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyFone-v${{ steps.version.outputs.tag }}
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Update README with Download Badge
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          if [ ! -f README.md ]; then
            echo "# PyFone 📱" > README.md
            echo "" >> README.md
            echo "A lightning-fast, ultra-responsive mobile Python IDE." >> README.md
          fi

          BADGE_LINE="[![PyFone Download](https://img.shields.io/badge/PyFone-v${VERSION}-395886?style=for-the-badge&logo=android&logoColor=white)](${DOWNLOAD_URL})"

          if grep -q "<!-- PYFONE_DOWNLOAD_BADGE -->" README.md; then
            sed -i "s|<!-- PYFONE_DOWNLOAD_BADGE -->.*|<!-- PYFONE_DOWNLOAD_BADGE -->\n${BADGE_LINE}|g" README.md
          else
            echo -e "\n## 📥 Download APK\n<!-- PYFONE_DOWNLOAD_BADGE -->\n${BADGE_LINE}" >> README.md
          fi

      - name: Commit and Push README Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: auto-update PyFone download badge to version ${{ steps.version.outputs.tag }}" || exit 0
          git push
